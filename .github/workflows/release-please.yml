name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # When the release PR merges, this step pushes a `vX.Y.Z` tag
          # AND creates the matching GitHub release. We then chain the
          # build pipeline via `workflow_call` below — we cannot use a
          # `push: tags` trigger on release-cli.yml because the default
          # GITHUB_TOKEN cannot trigger downstream workflows (anti-loop
          # protection).
      - name: Show release-please outputs
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        run: |
          echo "Released ${{ steps.rp.outputs.tag_name }}"
          echo "Major:    ${{ steps.rp.outputs.major }}"
          echo "Minor:    ${{ steps.rp.outputs.minor }}"
          echo "Patch:    ${{ steps.rp.outputs.patch }}"

  build-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release-cli.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    permissions:
      contents: write
    secrets: inherit
