name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The default GITHUB_TOKEN can open PRs and push tags. When the
          # release PR merges, this same step pushes a `vX.Y.Z` tag,
          # which fires `.github/workflows/release.yml` (build matrix)
          # which in turn fires `update-formula` (Homebrew bump) and
          # `docker.yml` (GHCR publish). No manual `git tag` ever needed.
      - name: Show release-please outputs
        if: ${{ steps.rp.outputs.release_created == 'true' }}
        run: |
          echo "Released ${{ steps.rp.outputs.tag_name }}"
          echo "Major:    ${{ steps.rp.outputs.major }}"
          echo "Minor:    ${{ steps.rp.outputs.minor }}"
          echo "Patch:    ${{ steps.rp.outputs.patch }}"
