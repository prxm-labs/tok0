name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations (preview)
        run: pnpm --filter @tok0/api db:migrate:preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env preview
      - name: Smoke check (preview)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://api-preview.tok0.dev/healthz; then
              exit 0
            fi
            echo "healthz not ready yet, retry $i/5..."
            sleep 5
          done
          exit 1

  production:
    # Three guards: branch is main, push event (not PR), and the repo
    # variable API_PROD_ENABLED is true. The variable defaults to false
    # until prod D1+KV IDs are filled into wrangler.toml and approved.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.API_PROD_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply D1 migrations (production)
        run: pnpm --filter @tok0/api db:migrate:prod
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy --env production
      - name: Smoke check (production)
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS https://api.tok0.dev/healthz; then
              exit 0
            fi
            echo "healthz not ready yet, retry $i/5..."
            sleep 5
          done
          exit 1
