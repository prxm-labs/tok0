name: CI (CLI)

on:
  push:
    branches: [main]
    paths:
      - 'apps/cli/**'
      - '.github/workflows/ci-cli.yml'
  pull_request:
    paths:
      - 'apps/cli/**'
      - '.github/workflows/ci-cli.yml'

concurrency:
  group: ci-cli-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/cli

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/cli
      # The `keyring` crate (cloud feature) links against libdbus on Linux
      # via the `sync-secret-service` backend. The Ubuntu runner image
      # doesn't ship dbus dev headers by default.
      - name: Install libdbus (Linux only, for cloud feature)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
        working-directory: .
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (features=cloud)
        run: cargo clippy --all-targets --features cloud -- -D warnings
      - name: Run tests
        run: cargo test --all
      - name: Run tests (features=cloud)
        run: cargo test --all --features cloud
      - name: Release build
        run: cargo build --release
      - name: Binary size check
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            size=$(stat -f%z target/release/tok0)
          else
            size=$(stat -c%s target/release/tok0)
          fi
          echo "Binary size: $size bytes"
          if [ "$size" -gt 8388608 ]; then
            echo "FAIL: binary >8MB ($size bytes)"
            exit 1
          fi
          echo "OK: binary within 8MB limit"
