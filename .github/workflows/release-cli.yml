name: Release (CLI)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross (Linux musl)
        if: matrix.cross
        run: cargo install cross
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
      - name: Rename + checksum
        id: artifacts
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXT=".exe"
          fi
          SRC="target/${{ matrix.target }}/release/tok0${EXT}"
          DEST="tok0-${{ matrix.target }}${EXT}"
          cp "$SRC" "$DEST"
          (sha256sum "$DEST" 2>/dev/null || shasum -a 256 "$DEST") > "${DEST}.sha256"
          echo "binary=${DEST}" >> "$GITHUB_OUTPUT"
          echo "checksum=${DEST}.sha256" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            apps/cli/${{ steps.artifacts.outputs.binary }}
            apps/cli/${{ steps.artifacts.outputs.checksum }}

      # Build a Debian package for the Linux glibc target only. cargo-deb
      # reads metadata from [package.metadata.deb] in apps/cli/Cargo.toml.
      - name: Install cargo-deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo install cargo-deb --locked
      - name: Build .deb
        id: deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo deb --no-build --target x86_64-unknown-linux-gnu
          DEB=$(ls target/x86_64-unknown-linux-gnu/debian/*.deb | head -1)
          cp "$DEB" "tok0_${{ github.ref_name }}_amd64.deb"
          sha256sum "tok0_${{ github.ref_name }}_amd64.deb" \
            > "tok0_${{ github.ref_name }}_amd64.deb.sha256"
          echo "deb=tok0_${{ github.ref_name }}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "deb_sha=tok0_${{ github.ref_name }}_amd64.deb.sha256" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Upload .deb to release
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            apps/cli/${{ steps.deb.outputs.deb }}
            apps/cli/${{ steps.deb.outputs.deb_sha }}

  update-formula:
    name: Update Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - name: Update Formula/tok0.rb with real SHA-256s
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-formula.sh "${{ steps.tag.outputs.version }}"
      - name: Commit + push formula update
        run: |
          if git diff --quiet Formula/tok0.rb; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tok0.rb
          git commit -m "chore(release): update Homebrew formula for ${{ steps.tag.outputs.version }}"
          git push origin HEAD:main
