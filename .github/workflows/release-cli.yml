name: Release (CLI)

# Reusable build pipeline. Invoked by release-please.yml after it tags a
# release, or manually via workflow_dispatch for incident recovery.
#
# We do NOT trigger on `push: tags: ['v*']` because release-please pushes
# tags using the default GITHUB_TOKEN, and GitHub Actions deliberately
# suppresses workflow chains triggered by GITHUB_TOKEN to prevent
# recursion. See: https://docs.github.com/actions/security-guides/automatic-token-authentication

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
        description: 'Release tag to build (e.g. v0.1.4).'
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true
        description: 'Existing release tag to build artifacts for (e.g. v0.1.4).'

permissions:
  contents: write

concurrency:
  group: release-cli-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      # One platform's failure must not cancel the others — otherwise a
      # broken `.deb` step or a flaky musl cross-compile takes the whole
      # release down and the Aggregate checksums.txt job (which `needs:
      # build`) never runs, leaving install.sh with no checksums file.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cross: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cross: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross (Linux musl)
        if: matrix.cross
        run: cargo install cross
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      # Raw binary + per-binary sha256 — consumed by Formula/tok0.rb and
      # apps/cli/scripts/update-formula.sh. Do not change names without
      # updating those.
      - name: Rename + checksum (raw binary)
        id: artifacts
        shell: bash
        run: |
          EXT=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXT=".exe"
          fi
          SRC="target/${{ matrix.target }}/release/tok0${EXT}"
          DEST="tok0-${{ matrix.target }}${EXT}"
          cp "$SRC" "$DEST"
          (sha256sum "$DEST" 2>/dev/null || shasum -a 256 "$DEST") > "${DEST}.sha256"
          echo "binary=${DEST}" >> "$GITHUB_OUTPUT"
          echo "checksum=${DEST}.sha256" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            apps/cli/${{ steps.artifacts.outputs.binary }}
            apps/cli/${{ steps.artifacts.outputs.checksum }}

      # Tarball archive — consumed by apps/website/public/install.sh.
      # Archive contains the binary renamed back to plain `tok0`.
      # Skipped on Windows: install.sh refuses Windows targets.
      - name: Build tarball archive
        id: tarball
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          STAGE=$(mktemp -d)
          cp "target/${{ matrix.target }}/release/tok0" "$STAGE/tok0"
          ARCHIVE="tok0-${{ inputs.tag }}-${{ matrix.target }}.tar.gz"
          tar -czf "$ARCHIVE" -C "$STAGE" tok0
          (sha256sum "$ARCHIVE" 2>/dev/null || shasum -a 256 "$ARCHIVE") > "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          echo "checksum=${ARCHIVE}.sha256" >> "$GITHUB_OUTPUT"
      - name: Upload tarball
        if: matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            apps/cli/${{ steps.tarball.outputs.archive }}
            apps/cli/${{ steps.tarball.outputs.checksum }}

      # Debian package for the Linux glibc target only. Marked
      # continue-on-error so a cargo-deb regression (e.g. missing
      # license file, schema change) cannot take down the matrix job
      # and starve the install.sh-critical Aggregate checksums.txt job.
      # The .deb is a nice-to-have; install.sh does not need it.
      - name: Install cargo-deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo install cargo-deb --locked
      - name: Build .deb
        id: deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        continue-on-error: true
        run: |
          cargo deb --no-build --target x86_64-unknown-linux-gnu
          DEB=$(find target/x86_64-unknown-linux-gnu/debian -maxdepth 1 -name '*.deb' | head -1)
          cp "$DEB" "tok0_${{ inputs.tag }}_amd64.deb"
          sha256sum "tok0_${{ inputs.tag }}_amd64.deb" \
            > "tok0_${{ inputs.tag }}_amd64.deb.sha256"
          echo "deb=tok0_${{ inputs.tag }}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "deb_sha=tok0_${{ inputs.tag }}_amd64.deb.sha256" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Upload .deb to release
        if: matrix.target == 'x86_64-unknown-linux-gnu' && steps.deb.outcome == 'success'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            apps/cli/${{ steps.deb.outputs.deb }}
            apps/cli/${{ steps.deb.outputs.deb_sha }}

  # Aggregate the per-platform tarball checksums into a single
  # checksums.txt file. install.sh greps this for "  <archive>$" so the
  # format must be sha256sum's standard `<sha>  <filename>` (two spaces).
  #
  # `if: !cancelled()` runs this even when one matrix leg failed —
  # better to ship a checksums.txt covering 4 platforms than to ship
  # zero because Windows or one Linux variant flaked. Without this, a
  # single matrix failure starves install.sh of its checksums file.
  checksums:
    name: Aggregate checksums.txt
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tarballs and compute checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir _checksums
          cd _checksums
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "tok0-${{ inputs.tag }}-*.tar.gz"
          shopt -s nullglob
          tarballs=(tok0-${{ inputs.tag }}-*.tar.gz)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "No tarballs found for ${{ inputs.tag }} — every build leg failed." >&2
            exit 1
          fi
          : > ../checksums.txt
          for f in "${tarballs[@]}"; do
            sha256sum "$f" >> ../checksums.txt
          done
          cd ..
          cat checksums.txt
      - name: Upload checksums.txt
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: checksums.txt

  update-formula:
    name: Update Homebrew formula
    needs: build
    # Same rationale as `checksums`: don't gate Homebrew bumps on a
    # 100%-green matrix. The formula only needs the macOS .sha256
    # files, which the script will explicitly check for.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    permissions:
      contents: write
    steps:
      # Checkout the default branch (main) — we commit the formula bump
      # there, not onto the tagged commit.
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip if Formula/tok0.rb does not exist yet
        id: has_formula
        working-directory: .
        run: |
          if [ -f Formula/tok0.rb ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Formula/tok0.rb not present — skipping Homebrew bump."
          fi
      - name: Update Formula/tok0.rb with real SHA-256s
        if: steps.has_formula.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/update-formula.sh "${{ inputs.tag }}"
      - name: Commit + push formula update
        if: steps.has_formula.outputs.exists == 'true'
        working-directory: .
        run: |
          if git diff --quiet Formula/tok0.rb; then
            echo "Formula already up to date; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tok0.rb
          git commit -m "chore(release): update Homebrew formula for ${{ inputs.tag }}"
          git push origin HEAD:main

  # Post-release smoke check. Fails the workflow loudly if any
  # install.sh-critical asset is missing — better to see a red workflow
  # than to ship a silently-empty release that 404s for users.
  verify-release:
    name: Verify release assets
    needs: [build, checksums]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check critical assets present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name')
          echo "Assets in $TAG:"
          echo "$assets"

          required=(
            "tok0-${TAG}-aarch64-apple-darwin.tar.gz"
            "tok0-${TAG}-x86_64-apple-darwin.tar.gz"
            "tok0-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
            "tok0-${TAG}-x86_64-unknown-linux-musl.tar.gz"
            "checksums.txt"
          )

          missing=0
          for f in "${required[@]}"; do
            if ! grep -Fxq "$f" <<< "$assets"; then
              echo "::error::Missing critical asset: $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing critical asset(s) missing — install.sh would 404."
            exit 1
          fi
          echo "All critical assets present — install.sh path verified."

      - name: Verify checksums.txt format matches install.sh expectations
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/${TAG}/checksums.txt" -o checksums.txt
          # install.sh greps for `  <archive>$` (two-space-separated).
          grep -E "^[0-9a-f]{64}  tok0-${TAG}-aarch64-apple-darwin\.tar\.gz$" checksums.txt
          echo "checksums.txt format OK."
