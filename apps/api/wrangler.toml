name = "tok0-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Default env (used by `wrangler dev` and `wrangler deploy`) targets the
# preview database. Production explicitly uses [env.production] below.

[[d1_databases]]
binding = "DB"
database_name = "tok0_preview"
database_id = "a74c6489-998f-45c8-8c25-b28249d778f2"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "STATS_CACHE"
id = "6dae290f8c5f47bf9b84f5eeaf95b940"

[env.preview]
# Both routes are served: api-preview.tok0.dev as a custom domain (now
# that the tok0.dev zone is in the account) and the *.workers.dev URL
# as a fallback for ad-hoc curl from machines without DNS resolution.
workers_dev = true
routes = [
  { pattern = "api-preview.tok0.dev", custom_domain = true }
]

[[env.preview.d1_databases]]
binding = "DB"
database_name = "tok0_preview"
database_id = "a74c6489-998f-45c8-8c25-b28249d778f2"
migrations_dir = "migrations"

[[env.preview.kv_namespaces]]
binding = "STATS_CACHE"
id = "6dae290f8c5f47bf9b84f5eeaf95b940"

[env.production]
routes = [
  { pattern = "api.tok0.dev", custom_domain = true }
]

[[env.production.d1_databases]]
binding = "DB"
database_name = "tok0_prod"
database_id = "b8beae40-8b3e-4d15-94a3-42c2ef17ce00"
migrations_dir = "migrations"

[[env.production.kv_namespaces]]
binding = "STATS_CACHE"
id = "8457679a001a4112ae0e730e0b332011"
