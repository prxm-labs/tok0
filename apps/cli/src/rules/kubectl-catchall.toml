[filter]
name = "kubectl-catchall"
commands = ["kubectl", "k"]
strip_patterns = [
  "^\\s*$",
  "^Warning: .* is deprecated",
  "^W\\d{4}\\s+",
  "^\\s*Annotations:",
  "^\\s*kubectl\\.kubernetes\\.io/",
  "^\\s*Last Applied Configuration:",
]
head_lines = 40
tail_lines = 5
max_line_chars = 140
empty_message = "kubectl: ok"
