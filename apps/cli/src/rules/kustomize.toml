[filter]
name = "kustomize"
commands = ["kustomize build", "kustomize edit", "kustomize create", "kubectl kustomize"]
strip_patterns = [
  "^# Generated by kustomize",
  "^---$",
]
head_lines = 30
tail_lines = 10
empty_message = "ok"

[[assertions]]
input = """apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  replicas: 3
---
apiVersion: v1
kind: Service
metadata:
  name: demo
"""
expected_contains = "Deployment"
min_savings_pct = 30
