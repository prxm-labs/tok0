[filter]
name = "brew-catchall"
commands = ["brew"]
strip_patterns = [
  "^\\s*$",
  "^==> Downloading",
  "^==> Pouring",
  "^Already downloaded:",
  "^==> Fetching",
  "^###",
  "^==> Auto-updated Homebrew",
  "^Updated \\d+ taps?",
  "^==> Checking for",
]
head_lines = 20
tail_lines = 5
max_line_chars = 140
empty_message = "brew: ok"
