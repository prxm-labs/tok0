[filter]
name = "xcodebuild"
commands = ["xcodebuild"]
strip_patterns = [
  "^\\s*$",
  "^CompileC\\s",
  "^CompileSwift\\s",
  "^Ld\\s",
  "^CreateBuildDirectory\\s",
  "^MkDir\\s",
  "^ProcessInfoPlistFile\\s",
  "^CopySwiftLibs\\s",
  "^CodeSign\\s",
  "^Signing Identity:",
  "^RegisterWithLaunchServices",
  "^Validate\\s",
  "^ProcessProductPackaging",
  "^Touch\\s",
  "^LinkStoryboards",
  "^CompileStoryboard",
  "^CompileAssetCatalog",
  "^GenerateDSYMFile",
  "^PhaseScriptExecution",
  "^PBXCp\\s",
  "^SetMode\\s",
  "^SetOwnerAndGroup\\s",
  "^Ditto\\s",
  "^CpResource\\s",
  "^CpHeader\\s",
  "^\\s+cd\\s+/",
  "^\\s+export\\s",
  "^\\s+/Applications/Xcode",
  "^\\s+/usr/bin/",
  "^\\s+builtin-",
  "^note: Using new build system",
]
head_lines = 60
empty_message = "xcodebuild: ok"
